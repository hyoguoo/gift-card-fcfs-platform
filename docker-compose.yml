services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    platform: linux/amd64
    container_name: zookeeper-container
    restart: always
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - fcfs-network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka-container
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-container:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    networks:
      - fcfs-network

  mysql:
    image: mysql:8.0.33
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: local59!
      MYSQL_DATABASE: default_db
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    networks:
      - fcfs-network

  redis:
    image: redis:7.0.11
    container_name: redis-container
    restart: always
    ports:
      - "6379:6379"
    networks:
      - fcfs-network

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service-container
    ports:
      - "8761:8761"
    depends_on:
      - mysql
      - redis
      - kafka
      - zookeeper
    networks:
      - fcfs-network

  api-gateway-service:
    build:
      context: .
      dockerfile: api-gateway-service/Dockerfile
    container_name: api-gateway-service-container
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
    networks:
      - fcfs-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service-container
    ports:
      - "9000:8080"
    depends_on:
      - api-gateway-service
    networks:
      - fcfs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  gift-card-service:
    build:
      context: .
      dockerfile: gift-card-service/Dockerfile
    container_name: gift-card-service-container
    ports:
      - "9010:8080"
    depends_on:
      - api-gateway-service
    networks:
      - fcfs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service-container
    ports:
      - "9020:8080"
    depends_on:
      - api-gateway-service
    networks:
      - fcfs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service-container
    ports:
      - "9030:8080"
    depends_on:
      - api-gateway-service
    networks:
      - fcfs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"

networks:
  fcfs-network:
    driver: bridge
